    ul {
      list-style-type: none;
      /* 移除默认的列表样式 */
    }

    .tree ul {
      margin-left: 20px;
      /* 嵌套列表缩进 */
    }

    .tree li {
      margin: 5px 0;
      /* 列表项间距 */
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: left;
      justify-content: left;
    }

    .txtsize {
      font-size: 20px;
      /* font-weight: bold; */

    }

    /* 调整checkbox的大小 */
    input[type="checkbox"] {
      transform: scale(1.5);
      /* 1.5倍大小，可以根据需要调整 */
    }

    .parentnode {
      font-size: 18px;
      font-weight: bold;
    }

    .btnsize {
      width: 120px;
      height: 40px;
      background: rgba(17, 123, 226, 0.50);
      border: 0.5px solid #117be2;
      border-radius: 22px;
      box-shadow: 2px 4px 0px 0px rgba(17, 123, 226, 0.30), 0px 0px 4px 1px #117be2 inset;

    }

    .expand-btn {
      background-color: #117be2;
      /* Green */
      border: none;
      color: white;
      padding: 0px 7px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 18px;
    }
  </style>
</head>

    function createCheckboxTree(data, container) {
      const ul = document.createElement('ul');
      ul.style.display = 'block';

      data.forEach(node => {
        const li = document.createElement('li');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `checkbox-${node.id}`;

        const label = document.createElement('label');
        label.htmlFor = `checkbox-${node.id}`;
        label.textContent = node.name;
        // label.textContent = node.label;

        // 添加展开按钮
        const expandBtn = document.createElement('button');
        expandBtn.type = 'button';
        expandBtn.textContent = '-';
        expandBtn.classList.add('expand-btn');

        expandBtn.addEventListener('click', function () {
          const childrenUL = li.querySelector('ul');

          if (childrenUL.style.display === 'none' || childrenUL.style.display === '') {
            childrenUL.style.display = 'block';
            expandBtn.textContent = '-';
          } else {

            childrenUL.style.display = 'none';
            expandBtn.textContent = '+';
          }
        });


        if (node.children && node.children.length > 0) {
          li.appendChild(expandBtn);
        }

        li.appendChild(checkbox);
        li.appendChild(label);

        if (node.children && node.children.length > 0) {
          // 添加父节点样式
          label.classList.add('parentnode');

          createCheckboxTree(node.children, li);
        }


        ul.appendChild(li);
      });

      container.appendChild(ul);
    }

    const treeContainer = document.getElementById('tree-container');
    createCheckboxTree(treeData, treeContainer);

    // 生成JS代码
    document.getElementById('btn_OK').addEventListener('click', function () {

      //弹出提示框 提示是否生成JS代码
      const isOK = window.confirm('是否生成JS代码');
      if (isOK) {
        // 生成JS代码

        const jsCode = generateJSCode(treeData, '', '');

        // 弹出提示框 提示JS代码
        // alert(jsCode);
        console.log(jsCode);

        // 将数据转换为字符串
        var dataString = `let coms=[];  \n${jsCode.join('')}`;

        var str1 = `const install = function (Vue) {
  coms.forEach((com) => {
    Vue.component(com.name, com);
  });
};   \n export default  install ;`

        dataString = dataString + str1;
        // const dataString = `let coms=[]; ${JSON.stringify(jsCode, null, 2)};`;

        // 创建一个Blob对象
        const blob = new Blob([dataString], {
          type: 'application/javascript'
        });

        // 创建一个临时的<a>元素
        const a = document.createElement('a');

        // 创建一个指向blob对象的URL
        const url = URL.createObjectURL(blob);

        // 设置下载属性
        a.href = url;
        a.download = 'index.js';

        // 触发点击事件以下载文件
        document.body.appendChild(a);
        a.click();

        // 移除临时的<a>元素并释放URL对象
        document.body.removeChild(a);
        URL.revokeObjectURL(url);


      }

    });


    function generateJSCode(data, parent_label, gra_label) {
      const jsCode = [];

      data.forEach(node => {
        const checkbox = document.getElementById(`checkbox-${node.id}`);

        var condition = (node.children && node.children.length > 0);

        if (node.label == 'LayerTree') {
          console.log('node.label,parent_label,gra_label');
          console.log(node.label, parent_label, gra_label);
        }

        //如果不再存在子节点
        if (!condition) {
          if (checkbox.checked) {
            // 根据treedata数组内的节点信息，转换成相应的字符串
            var componentPath = ``
            var pushStatement = ``
            var importStatement = ``
            if (node.label.indexOf('index.vue') !== -1) {
              // console.log("字符串包含 'index'");
              componentPath = `../views/maps/components/${gra_label}/${parent_label}/index.vue`;
              pushStatement = `coms.push(${parent_label});\n`;
              importStatement = `import ${parent_label} from '${componentPath}';\n`;
            } else {
              // console.log("字符串不包含 'index.vue'");
              componentPath = `../views/maps/components/${gra_label}/${parent_label}/${node.label}`;
              pushStatement = `coms.push(${node.label});\n`;
              importStatement = `import ${node.label} from '${componentPath}';\n`;
            }


            jsCode.push(importStatement, pushStatement);

            // jsCode.push({ id: node.id, label: node.label });
          }
        }

        //如果是父节点
        if (condition) {
          if (checkbox.checked) {

            // 确定新的 parent_label 和 gra_label   避免多次递归数据混乱
            var newParentLabel = '';
            var newGraLabel = '';

            // //第一次往下递归
            if (gra_label === '' && parent_label === '') {
              newParentLabel = node.label;
            }
            //第二次递归 如果父节点有值，祖父节点没有值  且还有子节点，则继续往下递归
            if (parent_label !== '' && gra_label === '') {
              newGraLabel = parent_label;
              newParentLabel = node.label;
            }

            jsCode.push(...generateJSCode(node.children, newParentLabel, newGraLabel));
            // jsCode.push(...generateJSCode(node.children, parent_label, gra_label));
          }
        }

      });

      return jsCode;
    }



    // 添加级联选择功能（可选）
    const checkboxes = document.querySelectorAll('#tree-container input[type="checkbox"]');
    checkboxes.forEach(checkbox => {
      checkbox.addEventListener('change', function () {
        const isChecked = this.checked;
        const childrenCheckboxes = findChildCheckboxes(this);
        childrenCheckboxes.forEach(childCheckbox => {
          childCheckbox.checked = isChecked;
        });
        // 添加对父复选框的更新逻辑 选中全部子节点的时候实现父节点的选中


      });

      function findChildCheckboxes(parentCheckbox) {
        const result = [];
        const parentLI = parentCheckbox.closest('li');
        if (parentLI) {
          const childrenUL = parentLI.querySelector('ul');
          if (childrenUL) {
            result.push(...childrenUL.querySelectorAll('input[type="checkbox"]'));
          }
        }
        return result;
      }
    });

    // 全选/取消全选按钮逻辑
    document.getElementById('select-all').addEventListener('click', function () {
      const checkboxes = document.querySelectorAll('#tree-container input[type="checkbox"]');
      // console.log('checkboxes', checkboxes);
      const isChecked = checkboxes[0].checked; // 假设所有复选框的初始状态一致
      var isAllChecked = true;
      checkboxes.forEach(checkbox => {
        if (!checkbox.checked) {
          isAllChecked = false;
        }
      });

      if (isAllChecked) {
        checkboxes.forEach(checkbox => {
          checkbox.checked = !isChecked;
        });
      } else {
        checkboxes.forEach(checkbox => {
          checkbox.checked = true;
        });
      }

    });

    // 展开全部按钮逻辑
    document.getElementById('expand-all').addEventListener('click', function () {
      const expandButtons = document.querySelectorAll('.expand-btn');
      expandButtons.forEach(button => {
        button.textContent = '-';
        const childrenUL = button.closest('li').querySelector('ul');
        if (childrenUL) {
          childrenUL.style.display = 'block';
        }
      });
    });

    // 折叠全部按钮逻辑
    document.getElementById('collapse-all').addEventListener('click', function () {
      const expandButtons = document.querySelectorAll('.expand-btn');
      expandButtons.forEach(button => {
        button.textContent = '+';
        const childrenUL = button.closest('li').querySelector('ul');
        if (childrenUL) {
          childrenUL.style.display = 'none';
        }
      });
    });
