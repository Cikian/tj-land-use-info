    <style>
        ul {
            list-style-type: none;
            /* 移除默认的列表样式 */
        }

        .tree {
            max-height: 800px;
            overflow-y: auto;
            width: 400px;

            /* 
            border: 1px solid #ccc;
            border-radius: 5px; */

        }

        .tree ul {
            margin-left: 20px;
            max-height: 1080px;

            /* 嵌套列表缩进 */
        }

        .tree li {
            margin: 8px 0;
            /* 列表项间距 */
        }

        .Seconde-container {
            max-height: 1080px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }


        body {
            max-height: 1080px;

            /* font-family: Arial, sans-serif; */
            font-family: 'sy', 'Source Han Sans CN', 'Source Han Sans CN-Regular';
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-height: 1000px;
            /* height: 100%; */
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .txtsize {
            font-size: 20px;
            /* font-weight: bold; */
            margin-bottom: 20px;
        }

        /* 调整checkbox的大小 */
        input[type="checkbox"] {
            transform: scale(1.5);
            /* 1.5倍大小，可以根据需要调整 */
            margin-right: 10px;
        }

        .parentnode {
            font-size: 24px;
            font-weight: bold;
        }

        .btnsize {
            width: 100px;
            height: 40px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        /* 展开/折叠按钮样式 */
        .expand-btn {
            /* position: absolute;
            left: -20px;
            top: 50%; */
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: none;
            background: none;
            color: #333;
            cursor: pointer;
            outline: none;
        }

        .expand-btn::before {
            position: absolute;
            left: -10px;
            top: 5px;
            content: '\25B6';
            /* 右箭头 */
            font-size: 24px;
            display: block;
            text-align: center;
        }

        .expand-btn.expanded::before {
            top: 10px;
            content: '\25BC';
            /* 下箭头 */
        }

        .btn-green {

            background-color: rgb(9, 151, 63);
        }
    </style>
</head>

        function generateJSCode(data, parent_label, gra_label) {
            const jsCode = [];

            data.forEach(node => {
                const checkbox = document.getElementById(`checkbox-${node.id}`);

                var hasChildren = (node.children && node.children.length > 0);

                // if (node.label == 'LayerTree') {
                //     console.log('node.label,parent_label,gra_label');
                //     console.log(node.label, parent_label, gra_label);
                // }

                //如果不再存在子节点  
                if (!hasChildren) {
                    if (checkbox.checked) {
                        // 根据treedata数组内的节点信息，转换成相应的字符串
                        var componentPath = ``
                        var pushStatement = ``
                        var importStatement = ``
                        if (node.label.indexOf('index.vue') !== -1) {
                            // console.log("字符串包含 'index'");
                            componentPath = `../views/maps/components/${gra_label}/${parent_label}/index.vue`;
                            pushStatement = `coms.push(${parent_label});\n`;
                            importStatement = `import ${parent_label} from '${componentPath}';\n`;
                        }
                        else {
                            // console.log("字符串不包含 'index.vue'");
                            componentPath = `../views/maps/components/${gra_label}/${parent_label}/${node.name}`;
                            pushStatement = `coms.push(${node.label});\n`;
                            importStatement = `import ${node.label} from '${componentPath}';\n`;
                        }


                        jsCode.push(importStatement, pushStatement);

                        // jsCode.push({ id: node.id, label: node.label });
                    }
                }

                //如果是父节点
                if (hasChildren) {
                    // if (checkbox.checked) {

                    // 确定新的 parent_label 和 gra_label   避免多次递归数据混乱
                    var newParentLabel = '';
                    var newGraLabel = '';

                    // //第一次往下递归
                    if (gra_label === '' && parent_label === '') {
                        newParentLabel = node.label;
                    }
                    //第二次递归 如果父节点有值，祖父节点没有值  且还有子节点，则继续往下递归
                    if (parent_label !== '' && gra_label === '') {
                        newGraLabel = parent_label;
                        newParentLabel = node.label;
                    }

                    jsCode.push(...generateJSCode(node.children, newParentLabel, newGraLabel));
                    // jsCode.push(...generateJSCode(node.children, parent_label, gra_label));
                    // }
                }

            });

            return jsCode;
        }


        function getSelectedItems(data) {
            const selectedItems = [];
            data.forEach(node => {
                const checkbox = document.getElementById(`checkbox-${node.id}`);
                if (checkbox.checked && getIdDepth(node.id) <= 1) {
                    selectedItems.push({ id: node.id, name: node.name });
                }
                if (node.children && node.children.length > 0) {
                    selectedItems.push(...getSelectedItems(node.children));
                }
            });
            return selectedItems;
        }

        function generateJson(jsCode) {
                // 将数据转换为字符串
                var dataString = `let coms=[];  \n${jsCode.join('')}`;

                var str1 = `const install = function (Vue) { 
coms.forEach((com) => { 
Vue.component(com.name, com);
});
};   \n export default  install ;`

                dataString = dataString + str1;
                // const dataString = `let coms=[]; ${JSON.stringify(jsCode, null, 2)};`;

                // 创建一个Blob对象
                const blob = new Blob([dataString], { type: 'application/javascript' });

                // 创建一个临时的<a>元素
                const a = document.createElement('a');

                // 创建一个指向blob对象的URL
                const url = URL.createObjectURL(blob);

                // 设置下载属性
                a.href = url;
                a.download = 'index.js';

                // 触发点击事件以下载文件
                document.body.appendChild(a);
                a.click();

                // 移除临时的<a>元素并释放URL对象
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

            }

        function generateWord(){

            const selectedItems = getSelectedItems(treeData);
            console.log('selectedItems', selectedItems);


            // const content = selectedItems.map(item => `${item.label} ${item.name}`).join('\n');
            const content = selectedItems.map(item => {
                const depth = getIdDepth(item.id);
                const prefix = depth === 1 ? '  ' : '';
                const fix2 = depth === 0 ? '\n' : '';
                return `${fix2}${prefix}${item.id} ${item.name}`;
            }).join('\n');
            
            console.log('content', content);
            const blob = new Blob([content], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '已选功能组件清单.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        const checkboxes = document.querySelectorAll('#tree-container input[type="checkbox"]');
        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', function () {
                const isChecked = this.checked;

                    childCheckbox.checked = isChecked;
                });
                // 添加对父复选框的更新逻辑 选中全部子节点的时候实现父节点的选中


            });

            function findChildCheckboxes(parentCheckbox) {
                const result = [];
                const parentLI = parentCheckbox.closest('li');
                if (parentLI) {
                    const childrenUL = parentLI.querySelector('ul');
                    if (childrenUL) {
                        result.push(...childrenUL.querySelectorAll('input[type="checkbox"]'));
                    }
                }
                return result;
            }
        });

        document.getElementById('select-all').addEventListener('click', function () {

            // console.log('checkboxes', checkboxes);
            const isChecked = checkboxes[0].checked; // 假设所有复选框的初始状态一致
            var isAllChecked = true;
            checkboxes.forEach(checkbox => {
                if (!checkbox.checked) {
                    isAllChecked = false;
                }
            });

            if (isAllChecked) {
                checkboxes.forEach(checkbox => {
                    checkbox.checked = !isChecked;

            }
            else {
                checkboxes.forEach(checkbox => {
                    checkbox.checked = true;
                });
