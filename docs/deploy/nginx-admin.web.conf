# =============================================================================
#  管理端（admin-client）  http://admin.web/
# -----------------------------------------------------------------------------
#  放到 phpstudy 的站点配置目录，覆盖原来那份同名/同站点的 vhost：
#    D:/phpstudy_pro/Extensions/Nginx-<版本>/conf/vhosts/admin.web.conf
#  （phpstudy 的 nginx.conf 里有 include vhosts/*.conf，放进去即生效；
#    替换后先 `nginx -t` 再重载站点，不要直接重启整台机器）
#
#  目录要求（vue-cli 产物，index.html 必须在这个 root 下）：
#    D:/phpstudy_pro/WWW/admin.web/index.html
#    D:/phpstudy_pro/WWW/admin.web/static/config.js   ← 接口地址就是这个文件（见同目录 static-config-admin.web.js）
#    D:/phpstudy_pro/WWW/admin.web/js|css|img|cdn|tinymce|...
#
#  同机服务（都在本机；换机器只改下面 4 个 127.0.0.1）：
#    Java 后端（jeecg）   127.0.0.1:9802   context-path = /api
#    kkFileView 文件预览   127.0.0.1:8012   /onlinePreview
# =============================================================================
server {
    listen       80;
    server_name  admin.web;

    root   "D:/phpstudy_pro/WWW/admin.web";
    index  index.html;

    charset utf-8;

    # 档案扫描件走 /api 上传，后端单文件上限是 200MB；nginx 默认 1MB 会先返回 413
    client_max_body_size 300m;

    # 前端产物是 hash 文件名，开 gzip 能省一半以上传输（phpstudy 的 nginx 都编了 gzip 模块）
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # ---------------- 前端静态资源 ----------------
    # admin-client 的路由是 history 模式：刷新 /dashboard/analysis 这类地址时磁盘上
    # 并没有该文件，必须回落到 index.html，否则一刷新就 404（这是最常见的"部署后白屏/404"）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不许缓存：发版后文件名带新 hash，旧壳子会去拉已经不存在的 js，白屏
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 带 hash 的静态资源长缓存
    location ^~ /js/      { expires 30d; }
    location ^~ /css/     { expires 30d; }
    location ^~ /img/     { expires 30d; }
    location ^~ /cdn/     { expires 30d; }
    location ^~ /tinymce/ { expires 30d; }

    # ---------------- Java 业务后端：/api/ → 127.0.0.1:9802/api/ ----------------
    # 前端 static/config.js 里把接口父路径配成 window.location.origin + '/api'，
    # 页面发出的请求就是 http://admin.web/api/xxx，由这里转给后端。
    # ★ proxy_pass 后面**不写 URI**：nginx 原样转发、保留 /api 前缀，
    #   正好对上后端 server.servlet.context-path=/api。写了会变成 /api/api/xxx。
    location /api/ {
        proxy_pass          http://127.0.0.1:9802;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # 后端默认 60s；大附件上传、Excel 导出、批量导入都会超，否则 504
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 上传体不要先整包落到 nginx 临时目录再转发（几百 MB 的档案包很吃磁盘）
        proxy_request_buffering off;
        # 导出/下载边收边发，不占内存
        proxy_buffering         off;
    }

    # ---------------- WebSocket（右上角消息通知）----------------
    # 前端拼出来的地址是 {origin}/api/websocket/{userId}，没有 Upgrade 头握手必失败。
    # ^~ 让这段优先于上面的 /api/ 前缀，普通接口不受影响。
    location ^~ /api/websocket {
        proxy_pass          http://127.0.0.1:9802;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ---------------- kkFileView 在线预览：/fileview/ → 127.0.0.1:8012/ ----------------
    # 前端 VUE_APP_ONLINE_BASE_URL = /fileview/onlinePreview，
    # 于是 /fileview/onlinePreview?url=xxx → http://127.0.0.1:8012/onlinePreview?url=xxx
    # ★ proxy_pass 末尾的 / 会把 /fileview 前缀去掉（不带 / 会变成 8012/fileview/... → 404）
    location /fileview/ {
        proxy_pass          http://127.0.0.1:8012/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $http_upgrade;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering     off;
    }

    # 需要单独看站点日志时放开这两行（logs 目录是 nginx 安装目录下的 logs，phpstudy 自带）
    #access_log logs/admin.web.access.log;
    #error_log  logs/admin.web.error.log warn;
}
