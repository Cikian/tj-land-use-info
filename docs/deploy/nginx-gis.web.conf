# =============================================================================
#  三维大屏端（stargis-client-web）  http://gis.web/
# -----------------------------------------------------------------------------
#  放到 phpstudy 的站点配置目录，覆盖原来那份：
#    D:/phpstudy_pro/Extensions/Nginx-<版本>/conf/vhosts/gis.web.conf
#
#  目录要求（vue-cli 产物，publicPath 是 './'，index.html 必须在 root 下）：
#    D:/phpstudy_pro/WWW/gis.web/index.html
#    D:/phpstudy_pro/WWW/gis.web/static/config.js   ← 三个后端地址都在这个文件里（见 static-config-gis.web.js）
#    D:/phpstudy_pro/WWW/gis.web/js|css|img|cdn|media|fonts|static|...
#
#  这台机器上要转发的服务（按现在的部署；没有的可以整段删掉，不影响其它页面）：
#    Java 业务后端（jeecg）  127.0.0.1:9802   context-path = /api
#    中台 ZK-SERVER          127.0.0.1:4548   路径以 /app/... 开头 → 反代时去掉 /zk 前缀
#    JNI 分析服务            127.0.0.1:38190  /pipeline/*、/api/file/*（断面/爆管/覆土等插件用）
#    地图服务                127.0.0.1:38083
#    数据服务                127.0.0.1:38084
#    kkFileView 文件预览      127.0.0.1:8012   /onlinePreview
#
#  ★ 为什么要把中台/分析服务也反代进 gis.web：
#    大屏的静态配置里这些地址原本写的是 http://127.0.0.1:xxxx，浏览器在别的电脑上打开时
#    127.0.0.1 指的是「那台电脑自己」，请求必然失败。改成同源路径 + 本文件转发，
#    浏览器只需要认 http://gis.web 一个地址（也顺便没有跨域问题）。
# =============================================================================
server {
    listen       80;
    server_name  gis.web;

    root   "D:/phpstudy_pro/WWW/gis.web";
    index  index.html;

    charset utf-8;

    # 档案附件上传走 /api，后端上限 200MB
    client_max_body_size 300m;

    # 大屏的 chunk-vendors / Cesium 都是大文件，gzip 收益很明显
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # ---------------- 前端静态资源 ----------------
    # 大屏路由是 hash 模式（#/screen/...），正常不会 404；这里照样回落，
    # 防止以后切 history 模式或有人直接访问 /index.html 之外的路径时踩坑。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ^~ /js/      { expires 30d; }
    location ^~ /css/     { expires 30d; }
    location ^~ /img/     { expires 30d; }
    location ^~ /cdn/     { expires 30d; }   # Cesium / Leaflet / jsWebControl，体积大，必须缓存
    location ^~ /media/   { expires 30d; }
    location ^~ /fonts/   { expires 30d; }
    location ^~ /tinymce/ { expires 30d; }

    # ---------------- Java 业务后端：/api/ → 127.0.0.1:9802/api/ ----------------
    # 对应 static/config.js 的 VUE_BUSINESS_JAVA_URL = origin + '/api'
    # ★ proxy_pass 不写 URI = 原样转发（保留 /api 前缀，对上后端 context-path）
    location /api/ {
        proxy_pass          http://127.0.0.1:9802;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # WebSocket（大屏目前用不到，留着避免以后加消息推送时踩坑）
    location ^~ /api/websocket {
        proxy_pass          http://127.0.0.1:9802;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ---------------- 中台 ZK-SERVER：/zk/ → 127.0.0.1:4548/ ----------------
    # 对应 static/config.js 的 VUE_APP_API_BASE_URL = origin + '/zk'
    # 中台接口路径形如 /app/oauth/token、/app/gisfun2usercontroller/...，
    # ★ proxy_pass 末尾必须有 /，nginx 才会把 /zk 前缀去掉：
    #     /zk/app/oauth/token  →  http://127.0.0.1:4548/app/oauth/token
    location /zk/ {
        proxy_pass          http://127.0.0.1:4548/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering         off;
    }

    # ---------------- JNI 分析服务：/analysis/ → 127.0.0.1:38190/ ----------------
    # 对应 static/config.js 的 VUE_DATA_JAVA_URL = origin + '/analysis'
    # 断面/爆管/覆土等插件会拼 /analysis/pipeline/drawHSection、/analysis/api/file/xxx，
    # 去掉前缀后正好是 38190 的 /pipeline/drawHSection、/api/file/xxx。
    # 后端没部署这个服务时这几段只是 502，不影响其它页面；不想要就整段删掉。
    location /analysis/ {
        proxy_pass          http://127.0.0.1:38190/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $http_upgrade;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # ---------------- 地图服务（38083）/ 数据服务（38084）----------------
    # 对应 static/config.js 的 VUE_MAP_URL = origin + '/mapsrv'、
    # VUE_DATA_SERVER_URL = origin + '/datasrv'。
    # 这两个服务不在本机（或不想反代）时，把 config.js 里对应两行改回实际地址，并删掉这两段。
    location /mapsrv/ {
        proxy_pass          http://127.0.0.1:38083/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  300s;
    }
    location /datasrv/ {
        proxy_pass          http://127.0.0.1:38084/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  300s;
    }

    # ---------------- kkFileView：/fileview/ → 127.0.0.1:8012/ ----------------
    location /fileview/ {
        proxy_pass          http://127.0.0.1:8012/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $http_upgrade;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering     off;
    }

    #access_log logs/gis.web.access.log;
    #error_log  logs/gis.web.error.log warn;
}
